stages:
  - build
  - bindings
  - package

variables:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  CROSS_CONTAINER_IN_CONTAINER: true

build-cross:
  stage: build
  image: rust:1.92.0
  before_script:
    - apt-get update && apt-get install -y apt-transport-https ca-certificates curl gnupg2 lsb-release pkg-config libssl-dev
    - curl -fsSL https://download.docker.com/linux/debian/gpg | gpg --dearmor -o /usr/share/keyrings/docker-archive-keyring.gpg
    - echo "deb [arch=amd64 signed-by=/usr/share/keyrings/docker-archive-keyring.gpg] https://download.docker.com/linux/debian $(lsb_release -cs) stable" > /etc/apt/sources.list.d/docker.list
    - apt-get update && apt-get install -y docker-ce docker-ce-cli containerd.io
    - cargo install cross --git https://github.com/cross-rs/cross
    - docker info
  script:
    - cd vdr/uniffi
    - cross build --release --target x86_64-linux-android
    - cross build --release --target aarch64-linux-android
    - cross build --release --target armv7-linux-androideabi
    - cross build --release --target i686-linux-android
    - cargo build --release
  artifacts:
    paths:
      - vdr/uniffi/out/
      - vdr/uniffi/target/**/release/*.so
      - vdr/uniffi/target/**/release/*.dylib
      - vdr/uniffi/target/**/release/*.framework
      - vdr/uniffi/target/release/*.so
      - vdr/uniffi/target/release/*.dylib
      - vdr/uniffi/target/release/*.framework
      - vdr/uniffi/wrappers/
    expire_in: 7 days

build_macos:
  stage: build
  tags:
    - macos   # garante que vai rodar só no runner com essa tag
  variables:
    CARGO_HOME: "/Users/serpro/.cargo"
    RUSTUP_HOME: "/Users/serpro/.rustup"
    PATH: "/usr/bin:/bin:/usr/sbin:/sbin:/usr/local/bin:/Users/serpro/.cargo/bin:$PATH"
  before_script:
    - rustup show  # debug: garante que o runner enxerga o mesmo rust
  script:
    - cd vdr/uniffi
    - ./build-swift-framework.sh
    - cargo build --release
    - cd out/indy_besu_vdrFFI.xcframework && grep -RIlF --binary-files=without-match --exclude-dir={.git,node_modules,venv} -- '<string>org.hyperledger.indy_besu_vdr</string>' . | xargs -I{} sed -i '' 's|<string>org.hyperledger.indy_besu_vdr</string>|<string>org.hyperledger.indy-besu-vdr</string>|g' "{}" && grep -RInF --binary-files=without-match --exclude-dir={.git,node_modules,venv} -- '<string>org.hyperledger.indy-besu-vdr</string>' .
  artifacts:
    paths:
      - vdr/uniffi/out/
      - vdr/uniffi/target/**/release/*.so
      - vdr/uniffi/target/**/release/*.dylib
      - vdr/uniffi/target/**/release/*.a
      - vdr/uniffi/target/**/release/*.framework
      - vdr/uniffi/target/release/*.so
      - vdr/uniffi/target/release/*.dylib
      - vdr/uniffi/target/release/*.a
      - vdr/uniffi/target/release/*.framework
      - vdr/uniffi/wrappers/
    expire_in: 7 days

generate-bindings:
  stage: bindings
  image: rust:1.89.0
  needs: ["build-cross", "build_macos"]
  script:
    - cd vdr/uniffi
    - cargo run --bin uniffi-bindgen generate --library target/release/libindy_besu_vdr_uniffi.so --language kotlin --out-dir out/kotlin --config uniffi.toml
    - cargo run --bin uniffi-bindgen generate --library target/release/libindy_besu_vdr_uniffi.so --language python --out-dir out/python
  artifacts:
    paths:
      - vdr/uniffi/out/
      - vdr/uniffi/target/**/release/*.so
      - vdr/uniffi/target/**/release/*.dylib
      - vdr/uniffi/target/**/release/*.a
      - vdr/uniffi/target/**/release/*.framework
      - vdr/uniffi/target/release/*.so
      - vdr/uniffi/target/release/*.dylib
      - vdr/uniffi/target/release/*.a
      - vdr/uniffi/target/release/*.framework
      - vdr/uniffi/wrappers/
    expire_in: 7 days

package:
  stage: package
  needs: ["generate-bindings"]
  script:
    - cd vdr/uniffi
    # Substitui '/' por '-' para nomes de branch seguros
    - PACKAGE_VERSION=${CI_COMMIT_REF_NAME//\//-}
    - TAR_NAME=libs-and-bindings-${PACKAGE_VERSION}.tar.gz
    - tar czf $TAR_NAME target out $(test -d wrappers && echo wrappers)
    # Upload direto no script garante que só tenta se o tar existir
    - echo "Enviando pacote para GitLab Package Registry..."
    - 'curl --fail --show-error --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file $TAR_NAME "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/libs-and-bindings/$PACKAGE_VERSION/$TAR_NAME"'
  artifacts:
    paths:
      - vdr/uniffi/libs-and-bindings-*.tar.gz
    expire_in: 30 days

package-python:
  stage: package
  image: python:3.12
  needs: ["generate-bindings"]
  variables:
    TWINE_REPOSITORY_URL: "https://gitcorporativo.serpro/api/v4/projects/21675/packages/pypi"
  before_script:
    - pip install build twine
    - apt-get update && apt-get install -y build-essential curl ca-certificates openssl
    - echo | openssl s_client -showcerts -servername gitcorporativo.serpro -connect gitcorporativo.serpro:443 2>/dev/null | awk '/BEGIN/,/END/{if(/BEGIN/){a++}; out="/tmp/gitcorporativo-"a".crt"; print >out} END{system("cat /tmp/gitcorporativo-*.crt > /tmp/gitcorporativo-chain.crt; cp /tmp/gitcorporativo-3.crt /tmp/gitcorporativo.crt 2>/dev/null || cp /tmp/gitcorporativo-chain.crt /tmp/gitcorporativo.crt")}' && export REQUESTS_CA_BUNDLE=/tmp/gitcorporativo.crt
    - export REQUESTS_CA_BUNDLE=/tmp/gitcorporativo.crt
  script:
    - cp vdr/uniffi/target/release/libindy_besu_vdr_uniffi.so vdr/wrappers/python/indy_besu_vdr/ || true
    - cp vdr/uniffi/target/release/libindy_besu_vdr_uniffi.dylib vdr/wrappers/python/indy_besu_vdr/ || true
    - cp vdr/uniffi/target/release/libindy_besu_vdr_uniffi.a vdr/wrappers/python/indy_besu_vdr/ || true
    - cd vdr/wrappers/python
    - python -m build
    # publica no GitLab PyPI
    - twine upload --repository-url "$TWINE_REPOSITORY_URL" -u __token__ -p "$CI_DEPLOY_TOKEN" --disable-progress-bar --verbose dist/*
  artifacts:
    paths:
      - vdr/wrappers/python/dist/*
    expire_in: 30 days